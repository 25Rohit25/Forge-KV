syntax = "proto3";

package com.forgekv.kv;

option java_multiple_files = true;
option java_package = "com.forgekv.kv.proto";

service KeyValueService {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
  string request_id = 3;
}

message PutResponse {
  bool success = 1;
  string leader_id = 2;
  string error_message = 3;
}

message GetRequest {
  bytes key = 1;
  string request_id = 2;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  string leader_id = 3;
  string error_message = 4;
}

message DeleteRequest {
  bytes key = 1;
  string request_id = 2;
}

message DeleteResponse {
  bool success = 1;
  string leader_id = 2;
  string error_message = 3;
}
