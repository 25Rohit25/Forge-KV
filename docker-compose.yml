version: '3.8'

services:
  node1:
    build: .
    container_name: forgekv_node1
    environment:
      NODE_ID: node1
      PORT: 7001
      METRICS_PORT: 8001
      DATA_DIR: /data
      PEERS: node2:node2:7002,node3:node3:7003
    ports:
      - "7001:7001"
      - "8001:8001"
    volumes:
      - node1_data:/data
    networks:
      - forgekv_net

  node2:
    build: .
    container_name: forgekv_node2
    environment:
      NODE_ID: node2
      PORT: 7002
      METRICS_PORT: 8002
      DATA_DIR: /data
      PEERS: node1:node1:7001,node3:node3:7003
    ports:
      - "7002:7002"
      - "8002:8002"
    volumes:
      - node2_data:/data
    networks:
      - forgekv_net

  node3:
    build: .
    container_name: forgekv_node3
    environment:
      NODE_ID: node3
      PORT: 7003
      METRICS_PORT: 8003
      DATA_DIR: /data
      PEERS: node1:node1:7001,node2:node2:7002
    ports:
      - "7003:7003"
      - "8003:8003"
    volumes:
      - node3_data:/data
    networks:
      - forgekv_net

volumes:
  node1_data:
  node2_data:
  node3_data:

networks:
  forgekv_net:
    driver: bridge
